<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CAJU CONTROL</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(135deg,
                    #0b1220,
                    #172554);

            display: flex;

            align-items: center;

            justify-content: center;

            color: #172033;

        }


        .login-container {

            width: 100%;

            max-width: 420px;

            padding: 20px;

        }


        .login-card {

            background: #ffffff;

            border-radius: 18px;

            padding: 40px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.25);

        }


        .logo {

            text-align: center;

            margin-bottom: 30px;

        }


        .logo h1 {

            font-size: 28px;

            font-weight: 800;

            color: #111827;

            letter-spacing: 1px;

        }


        .logo p {

            margin-top: 6px;

            font-size: 14px;

            color: #64748b;

        }


        .form-group {

            margin-bottom: 18px;

        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;

            color: #334155;

        }


        .form-group input {

            width: 100%;

            height: 48px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            padding: 0 14px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;

        }


        .form-group input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);

        }


        .senha-wrapper {

            position: relative;

        }


        .senha-wrapper input {

            padding-right: 75px;

        }


        .mostrar-senha {

            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 12px;

            color: #64748b;

        }


        .btn-login {

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: #ffffff;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;

        }


        .btn-login:hover {

            background: #1d4ed8;

        }


        .btn-login:disabled {

            opacity: 0.7;

            cursor: not-allowed;

        }


        .btn-google {

            width: 100%;

            height: 50px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            background: #ffffff;

            color: #1f2937;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;

        }


        .btn-google:hover {

            background: #f8fafc;

            border-color: #94a3b8;

        }


        .btn-google:disabled {

            opacity: 0.7;

            cursor: not-allowed;

        }


        .divisor {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 24px 0;

            color: #94a3b8;

            font-size: 12px;

        }


        .divisor::before,
        .divisor::after {

            content: "";

            flex: 1;

            height: 1px;

            background: #e2e8f0;

        }


        .links {

            text-align: center;

            margin-top: 18px;

        }


        .links button {

            border: none;

            background: transparent;

            color: #2563eb;

            font-size: 13px;

            cursor: pointer;

            font-weight: 600;

        }


        .links button:hover {

            text-decoration: underline;

        }


        .cadastro {

            text-align: center;

            margin-top: 22px;

            padding-top: 20px;

            border-top: 1px solid #e2e8f0;

            font-size: 13px;

            color: #64748b;

        }


        .cadastro button {

            border: none;

            background: transparent;

            color: #2563eb;

            font-weight: 700;

            cursor: pointer;

            margin-left: 4px;

        }


        .mensagem {

            display: none;

            margin-bottom: 18px;

            padding: 12px 14px;

            border-radius: 8px;

            font-size: 13px;

            line-height: 1.4;

        }


        .mensagem.erro {

            display: block;

            background: #fee2e2;

            color: #b91c1c;

            border: 1px solid #fecaca;

        }


        .mensagem.sucesso {

            display: block;

            background: #dcfce7;

            color: #15803d;

            border: 1px solid #bbf7d0;

        }


        .rodape {

            text-align: center;

            margin-top: 25px;

            font-size: 12px;

            color: #94a3b8;

        }


        @media (max-width: 480px) {

            .login-card {

                padding: 30px 25px;

            }

        }
    </style>

</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <!-- ================================= -->
            <!-- LOGO -->
            <!-- ================================= -->

            <div class="logo">

                <h1>
                    CAJU CONTROL
                </h1>

                <p>
                    Controle Financeiro
                </p>

            </div>


            <!-- ================================= -->
            <!-- MENSAGEM -->
            <!-- ================================= -->

            <div id="mensagem" class="mensagem"></div>


            <!-- ================================= -->
            <!-- LOGIN -->
            <!-- ================================= -->

            <form id="formLogin">

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="email" required>

                </div>


                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="senha-wrapper">

                        <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password"
                            required>

                        <button type="button" class="mostrar-senha" id="btnMostrarSenha">
                            Mostrar
                        </button>

                    </div>

                </div>


                <button type="submit" class="btn-login" id="btnLogin">
                    Entrar
                </button>

            </form>


            <!-- ================================= -->
            <!-- ESQUECI SENHA -->
            <!-- ================================= -->

            <div class="links">

                <button type="button" id="btnEsqueciSenha">
                    Esqueci minha senha
                </button>

            </div>


            <!-- ================================= -->
            <!-- DIVISOR -->
            <!-- ================================= -->

            <div class="divisor">
                ou
            </div>


            <!-- ================================= -->
            <!-- GOOGLE -->
            <!-- ================================= -->

            <button type="button" class="btn-google" id="btnGoogle">
                🌐&nbsp;&nbsp; Continuar com Google
            </button>


            <!-- ================================= -->
            <!-- CADASTRO -->
            <!-- ================================= -->

            <div class="cadastro">

                Ainda não possui uma conta?

                <button type="button" id="btnCadastro">
                    Criar conta
                </button>

            </div>


            <!-- ================================= -->
            <!-- RODAPÉ -->
            <!-- ================================= -->

            <div class="rodape">

                CAJU CONTROL © 2026

            </div>

        </div>

    </div>


    <!-- ===================================== -->
    <!-- SUPABASE -->
    <!-- ===================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- ===================================== -->
    <!-- CLIENTE SUPABASE -->
    <!-- ===================================== -->

    <script src="../assets/js/services/supabaseClient.js"></script>


    <!-- ===================================== -->
    <!-- AUTENTICAÇÃO -->
    <!-- ===================================== -->

    <script src="../assets/js/services/auth.js"></script>


    <script>

        // =====================================
        // ELEMENTOS
        // =====================================

        const formLogin =
            document.getElementById(
                "formLogin"
            );

        const emailInput =
            document.getElementById(
                "email"
            );

        const senhaInput =
            document.getElementById(
                "senha"
            );

        const btnLogin =
            document.getElementById(
                "btnLogin"
            );

        const btnGoogle =
            document.getElementById(
                "btnGoogle"
            );

        const btnCadastro =
            document.getElementById(
                "btnCadastro"
            );

        const btnEsqueciSenha =
            document.getElementById(
                "btnEsqueciSenha"
            );

        const btnMostrarSenha =
            document.getElementById(
                "btnMostrarSenha"
            );

        const mensagem =
            document.getElementById(
                "mensagem"
            );


        // =====================================
        // MENSAGEM
        // =====================================

        function mostrarMensagem(
            texto,
            tipo = "erro"
        ) {

            mensagem.textContent =
                texto;

            mensagem.className =
                "mensagem " + tipo;

        }


        function limparMensagem() {

            mensagem.textContent =
                "";

            mensagem.className =
                "mensagem";

        }


        // =====================================
        // MOSTRAR / OCULTAR SENHA
        // =====================================

        btnMostrarSenha.addEventListener(
            "click",
            () => {

                if (
                    senhaInput.type ===
                    "password"
                ) {

                    senhaInput.type =
                        "text";

                    btnMostrarSenha.textContent =
                        "Ocultar";

                } else {

                    senhaInput.type =
                        "password";

                    btnMostrarSenha.textContent =
                        "Mostrar";

                }

            }
        );


        // =====================================
        // LOGIN E-MAIL + SENHA
        // =====================================

        formLogin.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                limparMensagem();

                const email =
                    emailInput.value.trim();

                const senha =
                    senhaInput.value;


                if (!email) {

                    mostrarMensagem(
                        "Informe seu e-mail."
                    );

                    return;

                }


                if (!senha) {

                    mostrarMensagem(
                        "Informe sua senha."
                    );

                    return;

                }


                btnLogin.disabled =
                    true;

                btnLogin.textContent =
                    "Entrando...";


                const resultado =
                    await AuthService.login(
                        email,
                        senha
                    );


                if (
                    !resultado.sucesso
                ) {

                    mostrarMensagem(
                        "E-mail ou senha inválidos."
                    );

                    btnLogin.disabled =
                        false;

                    btnLogin.textContent =
                        "Entrar";

                    return;

                }


                mostrarMensagem(
                    "Login realizado com sucesso.",
                    "sucesso"
                );


                setTimeout(
                    () => {

                        window.location.href =
                            "dashboard.html";

                    },
                    500
                );

            }
        );


        // =====================================
        // LOGIN GOOGLE
        // =====================================

        btnGoogle.addEventListener(
            "click",
            async () => {

                limparMensagem();

                btnGoogle.disabled =
                    true;

                btnGoogle.textContent =
                    "Conectando com Google...";


                const resultado =
                    await AuthService.loginGoogle();


                if (
                    !resultado.sucesso
                ) {

                    mostrarMensagem(
                        "Não foi possível entrar com o Google."
                    );

                    btnGoogle.disabled =
                        false;

                    btnGoogle.textContent =
                        "🌐  Continuar com Google";

                }

            }
        );


        // =====================================
        // CADASTRO
        // =====================================

        btnCadastro.addEventListener(
            "click",
            () => {

                window.location.href =
                    "cadastro.html";

            }
        );


        // =====================================
        // ESQUECI MINHA SENHA
        // =====================================

        btnEsqueciSenha.addEventListener(
            "click",
            async () => {

                limparMensagem();

                const email =
                    emailInput.value.trim();


                if (!email) {

                    mostrarMensagem(
                        "Digite seu e-mail primeiro."
                    );

                    emailInput.focus();

                    return;

                }


                btnEsqueciSenha.disabled =
                    true;


                const resultado =
                    await AuthService.resetarSenha(
                        email
                    );


                if (
                    resultado.sucesso
                ) {

                    mostrarMensagem(
                        "Se o e-mail estiver cadastrado, enviaremos as instruções para redefinir sua senha.",
                        "sucesso"
                    );

                } else {

                    mostrarMensagem(
                        "Não foi possível solicitar a recuperação da senha."
                    );

                }


                btnEsqueciSenha.disabled =
                    false;

            }
        );


        // =====================================
        // VERIFICAR SESSÃO EXISTENTE
        // =====================================

        document.addEventListener(
            "DOMContentLoaded",
            async () => {

                const autenticado =
                    await AuthService.estaAutenticado();


                if (autenticado) {

                    window.location.href =
                        "dashboard.html";

                }

            }
        );

    </script>

</body>

</html>
