<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - CAJU CONTROL</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #0b1220,
                    #172554
                );

            display: flex;

            align-items: center;

            justify-content: center;

            color: #172033;

        }


        .login-container {

            width: 100%;

            max-width: 420px;

            padding: 20px;

        }


        .login-card {

            background: #ffffff;

            border-radius: 18px;

            padding: 40px;

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.25);

        }


        .logo {

            text-align: center;

            margin-bottom: 30px;

        }


        .logo h1 {

            font-size: 28px;

            font-weight: 800;

            color: #111827;

            letter-spacing: 1px;

        }


        .logo p {

            margin-top: 6px;

            font-size: 14px;

            color: #64748b;

        }


        .form-group {

            margin-bottom: 20px;

        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;

            color: #334155;

        }


        .form-group input {

            width: 100%;

            height: 48px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            padding: 0 14px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;

        }


        .form-group input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);

        }


        .btn-login {

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: #ffffff;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;

        }


        .btn-login:hover {

            background: #1d4ed8;

        }


        .btn-login:disabled {

            opacity: 0.7;

            cursor: not-allowed;

        }


        .mensagem {

            display: none;

            margin-bottom: 18px;

            padding: 12px 14px;

            border-radius: 8px;

            font-size: 13px;

            line-height: 1.4;

        }


        .mensagem.erro {

            display: block;

            background: #fee2e2;

            color: #b91c1c;

            border: 1px solid #fecaca;

        }


        .mensagem.sucesso {

            display: block;

            background: #dcfce7;

            color: #15803d;

            border: 1px solid #bbf7d0;

        }


        .rodape {

            text-align: center;

            margin-top: 25px;

            font-size: 12px;

            color: #94a3b8;

        }


        .senha-wrapper {

            position: relative;

        }


        .senha-wrapper input {

            padding-right: 55px;

        }


        .mostrar-senha {

            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 13px;

            color: #64748b;

        }


        @media (max-width: 480px) {

            .login-card {

                padding: 30px 25px;

            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <div class="login-card">


            <div class="logo">

                <h1>CAJU CONTROL</h1>

                <p>
                    Controle Financeiro
                </p>

            </div>


            <div
                id="mensagem"
                class="mensagem">
            </div>


            <form id="formLogin">


                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>


                    <div class="senha-wrapper">

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="mostrar-senha"
                            id="btnMostrarSenha">

                            Mostrar

                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn-login"
                    id="btnLogin">

                    Entrar

                </button>


            </form>


            <div class="rodape">

                CAJU CONTROL © 2026

            </div>


        </div>


    </div>


    <!-- ===================================== -->
    <!-- SUPABASE -->
    <!-- ===================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- ===================================== -->
    <!-- CLIENTE SUPABASE -->
    <!-- ===================================== -->

    <script src="../assets/js/services/supabaseClient.js"></script>


    <!-- ===================================== -->
    <!-- AUTENTICAÇÃO -->
    <!-- ===================================== -->

    <script src="../assets/js/services/auth.js"></script>


    <script>

        // =====================================
        // ELEMENTOS
        // =====================================

        const formLogin =
            document.getElementById("formLogin");

        const emailInput =
            document.getElementById("email");

        const senhaInput =
            document.getElementById("senha");

        const btnLogin =
            document.getElementById("btnLogin");

        const mensagem =
            document.getElementById("mensagem");

        const btnMostrarSenha =
            document.getElementById("btnMostrarSenha");


        // =====================================
        // MENSAGEM
        // =====================================

        function mostrarMensagem(
            texto,
            tipo = "erro"
        ) {

            mensagem.textContent =
                texto;

            mensagem.className =
                "mensagem " + tipo;

        }


        function limparMensagem() {

            mensagem.textContent = "";

            mensagem.className =
                "mensagem";

        }


        // =====================================
        // MOSTRAR / OCULTAR SENHA
        // =====================================

        btnMostrarSenha.addEventListener(
            "click",
            () => {

                if (
                    senhaInput.type ===
                    "password"
                ) {

                    senhaInput.type =
                        "text";

                    btnMostrarSenha.textContent =
                        "Ocultar";

                } else {

                    senhaInput.type =
                        "password";

                    btnMostrarSenha.textContent =
                        "Mostrar";

                }

            }
        );


        // =====================================
        // LOGIN
        // =====================================

        formLogin.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                limparMensagem();


                const email =
                    emailInput.value.trim();

                const senha =
                    senhaInput.value;


                if (!email) {

                    mostrarMensagem(
                        "Informe seu e-mail."
                    );

                    return;

                }


                if (!senha) {

                    mostrarMensagem(
                        "Informe sua senha."
                    );

                    return;

                }


                btnLogin.disabled =
                    true;

                btnLogin.textContent =
                    "Entrando...";


                const resultado =
                    await AuthService.login(
                        email,
                        senha
                    );


                if (!resultado.sucesso) {

                    mostrarMensagem(
                        "E-mail ou senha inválidos."
                    );

                    btnLogin.disabled =
                        false;

                    btnLogin.textContent =
                        "Entrar";

                    return;

                }


                mostrarMensagem(
                    "Login realizado com sucesso.",
                    "sucesso"
                );


                setTimeout(() => {

                    window.location.href =
                        "dashboard.html";

                }, 500);

            }
        );


        // =====================================
        // VERIFICAR SESSÃO EXISTENTE
        // =====================================

        document.addEventListener(
            "DOMContentLoaded",
            async () => {

                const autenticado =
                    await AuthService.estaAutenticado();


                if (autenticado) {

                    window.location.href =
                        "dashboard.html";

                }

            }
        );

    </script>


</body>

</html>
